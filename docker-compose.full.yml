include:
  - docker-compose.yml

services:
  revtech-app:
    image: revtech-app:0.0.1-SNAPSHOT
    container_name: revtech-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:8000"
    environment:
      SERVER_PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: revtech
      DB_USER: revtech_user
      DB_PASSWORD: ${DB_PASSWORD:-revtech_pass}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
      REVTECH_CLIENTS_MOCK: ${REVTECH_CLIENTS_MOCK:-true}
      CLIENTS_MTC_URL: ${CLIENTS_MTC_URL:-http://localhost:8089}
      SPRING_THREADS_VIRTUAL_ENABLED: ${SPRING_THREADS_VIRTUAL_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - revtech-network
