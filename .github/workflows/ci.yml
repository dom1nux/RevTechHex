name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 26
          cache: maven

      - name: Start MySQL
        run: docker compose up -d --wait mysql

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: MySQL logs
        if: failure()
        run: docker compose logs mysql

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: revtech-app/target/surefire-reports
