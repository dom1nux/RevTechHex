name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # The workflow always runs so the required checks always report.
  # Docs-only changes skip `unit` and `integration`; skipped jobs satisfy the ruleset.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'revtech-app/src/**'
              - '**/pom.xml'
              - 'mvnw'
              - '.mvn/**'
              - 'docker-compose.yml'
              - 'infra/**'
              - '.github/workflows/ci.yml'

  # Fail early: no database, so it runs in seconds and gates the integration job.
  unit:
    name: unit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 26
          cache: maven

      - name: Unit and architecture tests
        run: ./mvnw -B -ntp test -DexcludedGroups=integration

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: revtech-app/target/surefire-reports

  # Tests tagged @Tag("integration") need the live MySQL.
  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Boots while Java is set up; the wait happens right before the tests.
      - name: Start MySQL
        run: docker compose up -d mysql

      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: 26
          cache: maven

      - name: Wait for MySQL
        run: docker compose up -d --wait mysql

      - name: Integration tests
        run: ./mvnw -B -ntp test -Dgroups=integration

      - name: MySQL logs
        if: failure()
        run: docker compose logs mysql

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: revtech-app/target/surefire-reports
