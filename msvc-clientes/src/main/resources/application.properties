server.port=${SERVER_PORT:8081}
spring.application.name=msvc-clientes
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

# Database Datasource (MySQL 8.4 LTS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clientes}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:clientes_user}
spring.datasource.password=${DB_PASSWORD:clientes_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Scalar API Documentation
scalar.enabled=${SCALAR_ENABLED:true}
scalar.path=${SCALAR_PATH:/scalar}
scalar.url=/v3/api-docs
