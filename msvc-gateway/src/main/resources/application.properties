server.port=${SERVER_PORT:8000}
spring.application.name=msvc-gateway
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

# ==============================================================================
# 1. Routing to Downstream Microservices (Spring Cloud Gateway Server WebMVC)
# ==============================================================================

# Core: Inspección Técnica
spring.cloud.gateway.server.webmvc.routes[0].id=inspection-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${INSPECTION_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/inspecciones/**

# Soporte: Clientes y Vehículos
spring.cloud.gateway.server.webmvc.routes[1].id=clientes-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${CLIENTES_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/vehiculos/**,/api/clientes/**

# Soporte: Identidad y Acceso
spring.cloud.gateway.server.webmvc.routes[2].id=identidad-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${IDENTIDAD_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/usuarios/**,/api/auth/**

# ==============================================================================
# 2. Downstream OpenAPI Specification Forwarding
# ==============================================================================
spring.cloud.gateway.server.webmvc.routes[3].id=docs-inspection
spring.cloud.gateway.server.webmvc.routes[3].uri=${INSPECTION_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/v3/api-docs/inspection
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webmvc.routes[4].id=docs-clientes
spring.cloud.gateway.server.webmvc.routes[4].uri=${CLIENTES_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/v3/api-docs/clientes
spring.cloud.gateway.server.webmvc.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webmvc.routes[5].id=docs-identidad
spring.cloud.gateway.server.webmvc.routes[5].uri=${IDENTIDAD_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/v3/api-docs/identidad
spring.cloud.gateway.server.webmvc.routes[5].filters[0]=SetPath=/v3/api-docs

# ==============================================================================
# 3. Global CORS Configuration (Origins)
# ==============================================================================
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# ==============================================================================
# 4. Centralized Scalar Documentation Portal
# ==============================================================================
scalar.enabled=${SCALAR_ENABLED:true}
scalar.path=${SCALAR_PATH:/scalar}
scalar.url=/v3/api-docs/all
scalar.default-open-all-tags=true
scalar.show-sidebar=true

# Multi-spec sources configuration for Scalar API Reference
scalar.sources[0].title=Plataforma Completa (Todos los Servicios)
scalar.sources[0].url=/v3/api-docs/all
scalar.sources[0].slug=all
scalar.sources[0].default=true

scalar.sources[1].title=1. Inspeccion Core
scalar.sources[1].url=/v3/api-docs/inspection
scalar.sources[1].slug=inspection

scalar.sources[2].title=2. Clientes y Vehiculos
scalar.sources[2].url=/v3/api-docs/clientes
scalar.sources[2].slug=clientes

scalar.sources[3].title=3. Identidad y Acceso
scalar.sources[3].url=/v3/api-docs/identidad
scalar.sources[3].slug=identidad
