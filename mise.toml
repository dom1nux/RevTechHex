# mise configuration for the RevTech hexagonal modular monolith

[tasks."db:up"]
description = "Inicia el contenedor de base de datos MySQL 8.4 LTS"
run = "docker compose up -d mysql"

[tasks."db:down"]
description = "Detiene el contenedor de base de datos MySQL"
run = "docker compose down"

[tasks."db:recreate"]
description = "Elimina el volumen de MySQL y recrea la base revtech desde init-databases.sql (BORRA LOS DATOS)"
run = ["docker compose down -v", "docker compose up -d mysql"]

[tasks."db:logs"]
description = "Muestra los logs en tiempo real del contenedor MySQL"
run = "docker compose logs -f mysql"

[tasks."db:seed"]
description = "Carga infra/mysql/seed-data.sql en la base revtech (las tablas deben estar vacias; arranca la app una vez antes para crear el esquema)"
run = ["docker cp infra/mysql/seed-data.sql revtech-mysql:/tmp/seed-data.sql", "docker exec revtech-mysql sh -c \"mysql -urevtech_user -prevtech_pass revtech < /tmp/seed-data.sql\""]

[tasks."db:dump-seed"]
description = "Vuelca los datos actuales de revtech (solo INSERTs) a infra/mysql/seed-data.sql; ver infra/seed/seed.ps1"
run = ["docker exec revtech-mysql mysqldump -urevtech_user -prevtech_pass --no-tablespaces --no-create-info --complete-insert --skip-extended-insert --skip-add-locks --skip-comments --skip-triggers --result-file=/tmp/seed-data.sql revtech", "docker cp revtech-mysql:/tmp/seed-data.sql infra/mysql/seed-data.sql"]

[tasks.dev]
description = "Ejecuta revtech-app en el host (puerto 8000)"
run = "./mvnw spring-boot:run -pl revtech-app"
run_windows = "mvnw.cmd spring-boot:run -pl revtech-app"

[tasks."app:build"]
description = "Construye la imagen OCI de revtech-app con Buildpacks"
run = "./mvnw spring-boot:build-image -DskipTests"
run_windows = "mvnw.cmd spring-boot:build-image -DskipTests"

[tasks."app:up"]
description = "Levanta el sistema completo (MySQL + revtech-app) en Docker"
run = "docker compose -f docker-compose.full.yml up -d"

[tasks."app:down"]
description = "Detiene todos los contenedores de la plataforma completa"
run = "docker compose -f docker-compose.full.yml down"

[tasks."app:logs"]
description = "Muestra los logs en tiempo real de MySQL y revtech-app"
run = "docker compose -f docker-compose.full.yml logs -f"

[tasks."app:restart"]
description = "Reinicia todos los contenedores de la plataforma completa"
run = "docker compose -f docker-compose.full.yml restart"

[tasks.test]
description = "Ejecuta las pruebas unitarias del reactor multimódulo Maven"
run = "./mvnw test"
run_windows = "mvnw.cmd test"

[tasks.compile]
description = "Compila todos los módulos del proyecto"
run = "./mvnw clean compile"
run_windows = "mvnw.cmd clean compile"

[tasks.package]
description = "Empaqueta los JARs de todos los módulos sin ejecutar tests"
run = "./mvnw package -DskipTests"
run_windows = "mvnw.cmd package -DskipTests"
