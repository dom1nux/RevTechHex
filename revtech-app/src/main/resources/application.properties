server.port=${SERVER_PORT:8000}
spring.application.name=revtech-app
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

# Database Datasource (MySQL 8.4 LTS) - un único esquema; cada contexto es dueño de sus tablas
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:revtech}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:revtech_user}
spring.datasource.password=${DB_PASSWORD:revtech_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS (orígenes permitidos para los frontends)
revtech.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

# Sistema externo MTC: mock en memoria (true) o cliente OpenFeign (false)
revtech.clients.mock=${REVTECH_CLIENTS_MOCK:true}
clients.mtc.url=${CLIENTS_MTC_URL:http://localhost:8089}

# OpenAPI: un grupo por contexto acotado más la vista completa
springdoc.group-configs[0].group=all
springdoc.group-configs[0].display-name=Plataforma Completa
springdoc.group-configs[0].paths-to-match=/api/**
springdoc.group-configs[1].group=inspeccion
springdoc.group-configs[1].display-name=Inspeccion
springdoc.group-configs[1].paths-to-match=/api/inspecciones/**
springdoc.group-configs[2].group=clientes
springdoc.group-configs[2].display-name=Clientes y Vehiculos
springdoc.group-configs[2].paths-to-match=/api/clientes/**,/api/vehiculos/**
springdoc.group-configs[3].group=identidad
springdoc.group-configs[3].display-name=Identidad y Acceso
springdoc.group-configs[3].paths-to-match=/api/usuarios/**,/api/roles/**

# Scalar API Documentation
scalar.enabled=${SCALAR_ENABLED:true}
scalar.path=${SCALAR_PATH:/scalar}
scalar.url=/v3/api-docs/all
scalar.default-open-all-tags=true
scalar.show-sidebar=true
scalar.sources[0].title=Plataforma Completa
scalar.sources[0].url=/v3/api-docs/all
scalar.sources[0].slug=all
scalar.sources[0].default=true
scalar.sources[1].title=1. Inspeccion Core
scalar.sources[1].url=/v3/api-docs/inspeccion
scalar.sources[1].slug=inspeccion
scalar.sources[2].title=2. Clientes y Vehiculos
scalar.sources[2].url=/v3/api-docs/clientes
scalar.sources[2].slug=clientes
scalar.sources[3].title=3. Identidad y Acceso
scalar.sources[3].url=/v3/api-docs/identidad
scalar.sources[3].slug=identidad
