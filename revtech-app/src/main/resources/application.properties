server.port=${SERVER_PORT:8080}
spring.application.name=revtech-app
spring.threads.virtual.enabled=${SPRING_THREADS_VIRTUAL_ENABLED:true}

# Database Datasource (MySQL 8.4 LTS)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inspection}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:inspection_user}
spring.datasource.password=${DB_PASSWORD:inspection_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Simulación de clientes externos (Estrategia 1: Mock en memoria)
revtech.clients.mock=${REVTECH_CLIENTS_MOCK:true}

# URLs para OpenFeign (cuando revtech.clients.mock=false)
clients.msvc-clientes.url=${CLIENTS_MSVC_CLIENTES_URL:http://localhost:8081}
clients.msvc-identidad.url=${CLIENTS_MSVC_IDENTIDAD_URL:http://localhost:8082}
clients.mtc.url=${CLIENTS_MTC_URL:http://localhost:8089}

# Scalar API Documentation
scalar.enabled=${SCALAR_ENABLED:true}
scalar.path=${SCALAR_PATH:/scalar}
scalar.url=/v3/api-docs
